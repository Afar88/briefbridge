name: Auto open PR

# Opens a draft pull request into main whenever a new branch is pushed,
# so coding tools that can push but can't open PRs still end in a PR.
on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const { owner, repo } = context.repo;
            const open = await github.rest.pulls.list({ owner, repo, head: `${owner}:${branch}`, state: 'open' });
            if (open.data.length) { core.info(`PR already open: #${open.data[0].number}`); return; }
            const title = branch.replace(/^[^/]+\//, '').replace(/[-_]/g, ' ');
            const pr = await github.rest.pulls.create({
              owner, repo, head: branch, base: 'main', draft: true,
              title: title.charAt(0).toUpperCase() + title.slice(1),
              body: `Opened automatically after branch \`${branch}\` was pushed.\n\nReview before merging.`
            });
            core.info(`Opened PR #${pr.data.number}`);

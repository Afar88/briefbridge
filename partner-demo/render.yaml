services:
  - type: web
    name: shopstart
    runtime: static
    buildCommand: npm run check
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /agent-manifest.json
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /shopstart_network.network.json
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /links.json
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /.well-known/nsdeploy.json
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /.well-known/nsdeploy-agent.json
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /runtime/sandbox-worker.js
        name: Content-Security-Policy
        value: "default-src 'none'; script-src blob:; connect-src 'none'; worker-src 'none'"
